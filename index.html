<!DOCTYPE html>
<html lang="de">
<head>

<style>
/* VOICE: laute Kneipennacht – frech, kurz, null Lesestress
   IDEA: Bierdeckel auf dem Tresen – jede Ansage ist ein Deckel, der umgedreht wird
   PICTURE: der große runde Deckel mit Name + Schluck-Zahl ist das Bild jeder Runde
   COLOUR and TYPE: Weinrot-Nacht, Deckel-Creme, Kronengold, Alarmrot; Anton + Rubik
   LAYOUT: eine Spalte, Scoreboard oben fest, große Daumen-Buttons */
:root{color-scheme:dark;--bg:#1a0a12;--bg2:#26101c;--card:#341827;--line:#5a2c44;--ink:#fff3e4;--mute:#d4b3c1;--cream:#f6e7c8;--wine:#2a0f1c;--gold:#ffc93c;--red:#ff4757;--go:#2bd46b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#4a1630 0%,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#top{position:sticky;top:0;z-index:5;background:#1a0a12e8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top);border-bottom:1px solid #ffffff10}
.hb{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-left))}
.brand{font-family:Anton,sans-serif;font-size:20px;letter-spacing:.3px;color:var(--gold)}
.rn{flex:1;color:var(--mute);font-size:14px;white-space:nowrap}
.hbtn{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:600}
.board{display:flex;gap:8px;overflow-x:auto;max-width:560px;margin:0 auto;padding:2px 14px 10px;scrollbar-width:none}
.pc{flex:none;width:104px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 9px}
.pc.lead{border-color:var(--gold);box-shadow:0 0 14px #ffc93c40}
.pc .n{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .n svg{flex:none;color:var(--gold)}
.bar{height:6px;background:#0000005c;border-radius:3px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--cream);border-radius:3px;transition:width .7s cubic-bezier(.2,1,.3,1)}
.pc.lead .bar i{background:var(--gold)}
.pc .s{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.curse{color:var(--wine);background:var(--red);border-radius:6px;padding:0 5px;font-weight:800}
main{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}
.scr{animation:in .35s ease both}
.center{text-align:center}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(44px,13vw,60px);line-height:1.02;margin:10px 0 6px;color:var(--cream);text-wrap:balance}
h2{font-family:Anton,sans-serif;font-weight:400;font-size:34px;line-height:1.05;margin:6px 0 10px;text-wrap:balance}
p{margin:6px 0}
.sub{color:var(--mute);font-size:17px}
.lbl{color:var(--mute);font-size:14px;font-weight:600;margin:18px 0 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin-top:14px;border:0;border-radius:16px;background:var(--gold);color:var(--wine);font-weight:900;font-size:20px;box-shadow:0 6px 0 #b98712;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98712}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 0 #12060c}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #a3202d}
.btn:disabled{opacity:.35;pointer-events:none}
.in{width:100%;min-height:54px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-size:17px}
.in::placeholder{color:#a9879a}
textarea.in{padding:12px 14px;min-height:84px;resize:none}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;font-size:16px;min-height:48px}
.addrow{display:flex;gap:8px;margin-top:18px}
.addrow .btn{width:60px;flex:none;margin:0;font-size:30px}
.plist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.plist li{display:flex;align-items:center;gap:4px;background:var(--cream);color:var(--wine);border-radius:999px;padding:4px 4px 4px 14px;font-weight:800}
.plist li button{width:36px;height:36px;border-radius:50%;border:0;background:#2a0f1c1a;color:var(--wine);font-size:20px;line-height:1}
.plist .empty{background:none;color:var(--mute);font-weight:400;padding:4px 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:15px;padding:4px}
.seg button.on{background:var(--cream);color:var(--wine);border-color:var(--cream)}
.seg button.on.allin{background:var(--gold);border-color:var(--gold)}
.seg button.on.sab{background:var(--red);border-color:var(--red);color:#fff}
.seg button:disabled{opacity:.35}
.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;font-size:18px}
.rh svg{color:var(--gold)}
.hint{color:var(--mute);font-size:14px;margin:8px 2px 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.err{color:var(--red);font-weight:800;min-height:24px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tag{background:var(--red);color:#fff;border-radius:8px;padding:2px 9px;font-size:14px;font-weight:800}
.tag.g{background:var(--gold);color:var(--wine)}
.tag.c{background:var(--cream);color:var(--wine)}
.banner{display:flex;gap:10px;align-items:flex-start;background:#ffc93c18;border:1px solid #ffc93c66;border-radius:14px;padding:10px 12px;margin:12px 0;text-align:left}
.banner svg{flex:none;color:var(--gold);margin-top:3px}
.banner small{color:var(--mute)}
.coaster{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:18px auto;border-radius:50%;background:var(--cream);color:var(--wine);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:0 0 0 7px var(--cream),0 0 0 10px #d9bf8e,0 24px 44px #000a}
.coaster::before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px dashed #2a0f1c40;pointer-events:none}
.coaster.hot{background:var(--red);color:#fff;box-shadow:0 0 0 7px var(--red),0 0 0 10px #ff8a94,0 0 60px #ff475799}
.coaster.hot::before{border-color:#ffffff55}
.coaster.gold{background:var(--gold);box-shadow:0 0 0 7px var(--gold),0 0 0 10px #ffe39a,0 0 70px #ffc93c88}
.coaster.sm{width:min(60vw,230px);padding:22px}
.coaster.sm .big{font-size:64px}
.coaster .who{font-family:Anton,sans-serif;font-size:clamp(26px,8vw,36px);line-height:1.05;overflow-wrap:anywhere}
.coaster .big{font-family:Anton,sans-serif;font-size:clamp(76px,24vw,112px);line-height:1}
.coaster .unit{font-weight:900;letter-spacing:.5px}
.coaster .pts{font-weight:800;margin-top:4px}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
.drum{font-family:Anton,sans-serif;font-size:40px;margin-top:30vh;animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08);color:var(--gold)}}
.clock{font-family:Anton,sans-serif;font-size:clamp(84px,28vw,130px);line-height:1;margin:22px 0;font-variant-numeric:tabular-nums}
.huge{min-height:150px;font-size:34px;border-radius:24px}
.signal{height:130px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:46px;background:var(--bg2);border:1px solid var(--line);margin:8px 0 12px}
.signal.wait{background:#6b1326;border-color:#6b1326}
.signal.go{background:var(--go);color:#062a12;border-color:var(--go)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rbtn{min-height:112px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:6px}
.rbtn small{font-size:13px;font-weight:600;color:var(--mute)}
.rbtn.done{background:var(--cream);color:var(--wine);border-color:var(--cream)}
.rbtn.done small{color:var(--wine)}
.rbtn.out{opacity:.4;border-style:dashed}
table{width:100%;border-collapse:collapse;margin:12px 0;font-variant-numeric:tabular-nums}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-size:13px;font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
tr.win td{color:var(--gold);font-weight:800}
.q{font-family:Anton,sans-serif;font-size:clamp(30px,9vw,40px);line-height:1.1;margin:14px 0;text-wrap:balance}
.cd{font-family:Anton,sans-serif;font-size:80px;line-height:1;color:var(--gold)}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.pick button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:17px}
.pick button.on{background:var(--gold);color:var(--wine);border-color:var(--gold)}
.arena{position:relative;height:min(56vh,430px);border-radius:24px;background:radial-gradient(circle at 50% 50%,#4a1424,var(--bg2));border:1px solid var(--line);overflow:hidden;margin-top:10px}
.pass{position:absolute;width:136px;height:136px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:900;font-size:18px;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 8px #ff475744,0 0 40px #ff4757aa;animation:heat .5s ease-in-out infinite alternate;transition:left .18s,top .18s}
@keyframes heat{to{box-shadow:0 0 0 16px #ff475722,0 0 70px #ff4757}}
.arena.boom{animation:boom .6s ease both}
@keyframes boom{0%{background:#fff}40%{background:var(--gold)}100%{background:var(--red)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;text-align:left}
.card.on{border-color:var(--gold);background:#ffc93c1c}
.card b{display:block;font-size:18px}
.card span{color:var(--mute);font-size:14px}
button.card{width:100%;display:block}
.sabcard{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:16px;padding:14px;margin:10px 0;font-weight:800;text-align:left;animation:slam .45s cubic-bezier(.2,1.5,.4,1) both}
.sabcard small{display:block;font-weight:600;opacity:.9}
@keyframes slam{from{opacity:0;transform:translateX(-30px) rotate(-3deg)}}
details.rules{margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.rules summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.rules li{margin:6px 0;color:var(--mute)}
details.rules b{color:var(--ink)}
.fine{color:#a9879a;font-size:13px;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:var(--red);pointer-events:none;z-index:9;animation:fl .5s ease forwards}
@keyframes fl{from{opacity:.55}to{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<script>
{
// ================= KONFIG – hier neue Inhalte ergänzen =================
const STRATS={
  safe:{label:'Sicher',pts:1,drinks:1,hint:'Bei Sieg: +1 Punkt · 1 Schluck'},
  allin:{label:'All-In',pts:3,drinks:2,hint:'Bei Sieg: +3 Punkte · 2 Schlucke'},
  sab:{label:'Saboteur',pts:0,drinks:0,hint:'Spielt nicht mit · verpasst jemandem einen Nachteil'}
};
// Sabotage-Karten. "slow" wirkt je nach Minispiel anders (siehe GAMES).
const EFFECTS={
  dbl:{label:'Doppelt trinken',short:'×2 Schlucke'},
  slow:{label:'Bremse',short:'Bremse'},
  hand:{label:'Schwache Hand',short:'Schwache Hand'},
  minus:{label:'Punktklau',short:'−1 Punkt'}
};
// Kronen-Mächte für den Führenden. need = wie viele andere Spieler nötig sind.
const POWERS={
  force:{label:'All-In erzwingen',desc:'Ein Mitspieler muss All-In gehen.',need:1},
  swap:{label:'Punkte tauschen',desc:'Zwei Mitspieler tauschen ihre Punkte.',need:2},
  curse:{label:'Gratis-Sabotage',desc:'Du verteilst einen Nachteil und spielst trotzdem mit.',need:1}
};
const MAX_DRINKS=10;    // Deckel pro Runde
const HOT_CHANCE=0.2;   // Wahrscheinlichkeit für "Heißes Eisen" ab Runde 2
const QUESTIONS=[ // [Frage, Antwort, Einheit]
  ['Wie hoch ist der Eiffelturm (mit Antenne)?',330,'m'],['Wie viele Knochen hat ein erwachsener Mensch?',206,''],
  ['In welchem Jahr fiel die Berliner Mauer?',1989,''],['Wie hoch ist die Zugspitze?',2962,'m'],
  ['Wie viele Tasten hat ein Klavier?',88,''],['In welchem Jahr landeten Menschen zum ersten Mal auf dem Mond?',1969,''],
  ['Wie viele Länder sind in der EU?',27,''],['Wie hoch ist der Mount Everest?',8849,'m'],
  ['Wie viele Minuten hat ein Tag?',1440,''],['Wie lang ist ein Marathon in Metern?',42195,'m'],
  ['Wie viele Zähne hat ein Erwachsener mit Weisheitszähnen?',32,''],['Wie viele Felder hat ein Schachbrett?',64,''],
  ['In welchem Jahr begann der Erste Weltkrieg?',1914,''],['Wie schnell ist Schall in Luft bei 20 °C?',343,'m/s'],
  ['Wie weit ist der Mond im Schnitt von der Erde weg?',384400,'km'],['Wie alt wurde Mozart?',35,'Jahre'],
  ['Wie viele Herzen hat ein Oktopus?',3,''],['In welchem Jahr wurde Google gegründet?',1998,''],
  ['Wie viel Prozent der Erdoberfläche sind Wasser?',71,'%'],['Wie hoch ist der Kölner Dom?',157,'m'],
  ['In welchem Jahr sank die Titanic?',1912,''],['Wie viele Karten hat ein Skatblatt?',32,''],
  ['Wie viele Augen hat ein normaler Würfel zusammen?',21,''],['In welchem Jahr ging YouTube online?',2005,''],
  ['Wie viele Mitgliedsstaaten haben die Vereinten Nationen?',193,''],['Wie groß ist der Durchmesser der Erde?',12742,'km'],
  ['Wie hoch ist der Burj Khalifa?',828,'m'],['Wie viele Sterne hat die EU-Flagge?',12,''],
  ['Wie viele Streifen hat die US-Flagge?',13,''],['Wie viele Kantone hat die Schweiz?',26,''],
  ['Wie hoch ist der Großglockner?',3798,'m'],['Wie tief ist der Marianengraben ungefähr?',11000,'m'],
  ['In welchem Jahr wurde das erste iPhone vorgestellt?',2007,''],['Wie viele Sekunden braucht Sonnenlicht ungefähr zur Erde?',500,'s'],
  ['Wie viele Spieltage hat eine Bundesliga-Saison?',34,''],['Wie viele Tore fielen 2014 beim WM-Halbfinale Brasilien gegen Deutschland insgesamt?',8,''],
  ['Wie lang ist der Rhein?',1233,'km'],['Bei wie viel Grad Fahrenheit kocht Wasser?',212,'°F'],
  ['Wie viele Einwohner hat Deutschland ungefähr?',84,'Mio.'],['Wie viele Bundesländer hat Österreich?',9,''],
  ['Wie viele Beine hat ein Hummer?',10,''],['In welchem Jahr kam die erste PlayStation in Japan raus?',1994,''],
  ['Wie viele Folgen hat „Breaking Bad“?',62,''],['Wie schwer darf ein Fußball laut Regel höchstens sein?',450,'g'],
  ['Wie viele Liter Blut hat ein Erwachsener ungefähr?',5,'l'],['Wie viele Tage braucht der Mond ungefähr für eine Runde um die Erde?',27,'Tage']
];
const KING_IDEAS=['Wer flucht, trinkt einen Schluck.','Vor jedem Schluck ruft man „Auf die Majestät!“','Niemand darf den König beim Namen nennen.','Getrunken wird nur mit der schwachen Hand.','Wer außerhalb des Spiels aufs Handy schaut, trinkt.','Der König wählt einen Trinkpartner, der immer mittrinkt.','Wer „trinken“ sagt, trinkt.','Vor jeder Runde stoßen alle mit dem König an.'];

// ================= STATE & HELFER =================
const S={players:[],target:10,round:0,crown:null,kingRule:'',lastGame:null,usedQ:[],sound:true};
let R=null, pid=0, timers=[], raf=0;
const app=document.getElementById('app'), topEl=document.getElementById('top');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>esc(P(id)?P(id).name:'?');
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sec=x=>x.toFixed(2).replace('.',',');
const fmt=n=>n.toLocaleString('de-DE');
const later=(f,ms)=>{timers.push(setTimeout(f,ms))};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf)};
const CROWN=(s=16)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-label="Krone"><path d="M2.5 7.5l5 4.2L12 4l4.5 7.7 5-4.2L19.4 19H4.6z" fill="currentColor"/><rect x="4.6" y="20" width="14.8" height="2" rx="1" fill="currentColor"/></svg>`;
const mkPlayer=name=>({id:'p'+(++pid),name,score:0});
function save(){try{localStorage.setItem('siegerschluck',JSON.stringify({names:S.players.map(p=>p.name),target:S.target,kingRule:S.kingRule,sound:S.sound}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('siegerschluck')||'null');if(d){S.players=(d.names||[]).slice(0,8).map(mkPlayer);S.target=d.target||10;S.kingRule=d.kingRule||'';S.sound=d.sound!==false}}catch(e){}}
function show(html,keep){clearTimers();const y=window.scrollY;app.innerHTML=html;window.scrollTo(0,keep?y:0)}
const effs=id=>R?R.sabs.filter(s=>s.to===id).map(s=>s.eff):[];
const has=(id,e)=>effs(id).includes(e);
const cnt=(id,e)=>effs(id).filter(x=>x===e).length;
const tags=id=>{const e=effs(id);return e.length?`<div class="tags">${e.map(x=>`<span class="tag">${EFFECTS[x].short}</span>`).join('')}</div>`:''};
const curseNext=()=>Math.min(3,(S.crown?S.crown.streak:0)+2);

// ================= SOUND & VIBRATION =================
let ac=null;
function audio(){if(!S.sound)return null;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d=.12,type='square',vol=.07,when=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
  tap:()=>tone(660,.05),go:()=>tone(1046,.2,'square',.11),tick:()=>tone(1500,.03,'square',.05),
  bad:()=>{tone(190,.25,'sawtooth',.09);tone(120,.32,'sawtooth',.09,.12)},
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.1)),
  fanfare:()=>[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.24,'triangle',.13,i*.13)),
  boom:()=>{const a=audio();if(!a)return;const len=a.sampleRate*.8,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.6;s.buffer=b;s.connect(g).connect(a.destination);s.start()}
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const flash=()=>{const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),600)};

// ================= SCOREBOARD =================
function board(){
  const hb=`<div class="hb"><span class="brand">Siegerschluck</span><span class="rn">${R?'Runde '+S.round:''}</span><button class="hbtn" data-act="sound">${S.sound?'Ton an':'Ton aus'}</button>${R?'<button class="hbtn" data-act="quit">Menü</button>':''}</div>`;
  if(!R){topEl.innerHTML=hb;return}
  topEl.innerHTML=hb+`<div class="board">${S.players.map(p=>{const c=S.crown&&S.crown.id===p.id;return `<div class="pc${c?' lead':''}"><div class="n">${c?CROWN(15):''}${esc(p.name)}</div><div class="bar"><i style="width:${Math.min(100,p.score/S.target*100)}%"></i></div><div class="s"><span>${p.score}/${S.target}</span>${c?`<span class="curse" title="Fluch: so viel kostet sein nächster Sieg">×${curseNext()}</span>`:'<span>×1</span>'}</div></div>`}).join('')}</div>`;
}
function leader(){
  const max=Math.max(...S.players.map(p=>p.score));if(max<=0)return null;
  const tops=S.players.filter(p=>p.score===max);
  if(tops.length===1)return tops[0].id;
  return S.crown&&tops.some(p=>p.id===S.crown.id)?S.crown.id:null;
}
function updateCrown(){const l=leader();const old=S.crown?S.crown.id:null;if(l!==old)S.crown=l?{id:l,streak:0}:null;return l!==old?l:undefined}

// ================= SETUP =================
function goSetup(){
  R=null;board();
  show(`<section class="scr">
  <h1>Der Gewinner trinkt.</h1>
  <p class="sub">Ein Handy, alle drumherum. Wer gewinnt, kriegt Punkte – und Schlucke.</p>
  ${S.kingRule?`<div class="banner">${CROWN(20)}<div><small>Königs-Regel aus der letzten Partie</small><br><b>${esc(S.kingRule)}</b></div></div>`:''}
  <form id="add" class="addrow"><input id="nm" class="in" maxlength="14" placeholder="Name eingeben" autocomplete="off" enterkeyhint="done" aria-label="Spielername"><button class="btn" type="submit" aria-label="Hinzufügen">+</button></form>
  <ul class="plist">${S.players.length?S.players.map(p=>`<li>${esc(p.name)}<button data-act="rm" data-id="${p.id}" aria-label="${esc(p.name)} entfernen">×</button></li>`).join(''):'<li class="empty">Noch keiner da – mindestens 2, höchstens 8.</li>'}</ul>
  <p class="err" id="serr"></p>
  <p class="lbl">Spielen bis</p>
  <div class="seg">${[5,10,15].map(n=>`<button data-act="target" data-n="${n}" class="${S.target===n?'on':''}">${n} Punkte</button>`).join('')}</div>
  <button class="btn" data-act="start" ${S.players.length<2?'disabled':''}>Los geht's</button>
  <details class="rules"><summary>So geht's</summary><ul>
    <li><b>Rundensieg</b> = Punkte <b>und</b> Schlucke.</li>
    <li>Vor jeder Runde wählt jeder: <b>Sicher</b> (+1 / 1 Schluck), <b>All-In</b> (+3 / 2 Schlucke) oder <b>Saboteur</b> (spielt nicht mit, verpasst jemandem einen Nachteil).</li>
    <li><b>Krone:</b> Wer führt, hat vor jeder Runde eine Macht. Aber jeder weitere Sieg kostet ×2, dann ×3 – bis ihn jemand überholt.</li>
    <li><b>Heißes Eisen:</b> Zwangsrunde. Wer das Eisen beim Knall hält, gewinnt – Schlucke ×2.</li>
    <li>Wer zuerst die Punkte voll hat, trinkt den <b>Sieger-Drink</b> und bestimmt die <b>Königs-Regel</b>.</li>
    <li>Pro Runde nie mehr als ${MAX_DRINKS} Schlucke.</li></ul></details>
  <p class="fine">Ab 18. Trinkt mit Verstand – Wasser oder Limo zählen genauso.</p>
  </section>`);
  $('#add').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim();const err=$('#serr');
    if(!v)return;if(S.players.length>=8){err.textContent='Maximal 8 Spieler.';return}
    if(S.players.some(p=>p.name.toLowerCase()===v.toLowerCase())){err.textContent='Den Namen gibt es schon.';return}
    S.players.push(mkPlayer(v));save();goSetup();$('#nm').focus()};
}

// ================= RUNDENABLAUF =================
function newGame(){S.players.forEach(p=>p.score=0);S.crown=null;S.round=0;S.lastGame=null;nextRound()}
function nextRound(){
  S.round++;
  const ids=Object.keys(GAMES);
  let gid=(S.round>1&&S.lastGame!=='bomb'&&Math.random()<HOT_CHANCE)?'bomb':pick(ids.filter(g=>!GAMES[g].hot&&g!==S.lastGame));
  S.lastGame=gid;
  R={game:gid,hot:!!GAMES[gid].hot,strat:{},locked:{},sabT:{},sabE:{},sabs:[],parts:[],crownStart:S.crown?S.crown.id:null,pw:{type:null,a:null,b:null,eff:'dbl'}};
  S.players.forEach(p=>R.strat[p.id]='safe');
  board();intro();
}
function intro(){
  const g=GAMES[R.game];SFX.tap();
  show(`<section class="scr center">
   <p class="lbl">Runde ${S.round}</p>
   <div class="coaster${R.hot?' hot':''} pop"><div class="unit">${R.hot?'ZWANGSRUNDE':'MINISPIEL'}</div><div class="who" style="margin:6px 0">${g.name}</div><div style="font-size:15px">${g.desc}</div></div>
   ${R.hot?'<div class="tags"><span class="tag">Schlucke ×2</span><span class="tag c">Keiner will gewinnen</span></div>':''}
   ${S.crown?`<div class="banner">${CROWN(20)}<div><b>${nm(S.crown.id)} trägt die Krone.</b><br><small>Darf gleich eine Macht einsetzen – nächster Sieg kostet ×${curseNext()}.</small></div></div>`:''}
   ${S.kingRule?`<div class="banner">${CROWN(20)}<div><small>Königs-Regel</small><br>${esc(S.kingRule)}</div></div>`:''}
   <button class="btn" id="next">${S.crown?'Zur Kronen-Macht':'Einsätze wählen'}</button></section>`);
  $('#next').onclick=()=>S.crown?powerScreen():stratScreen();
}
function powerScreen(keep){
  const cid=S.crown.id, others=S.players.filter(p=>p.id!==cid).map(p=>p.id), pw=R.pw;
  if(pw.a&&!others.includes(pw.a))pw.a=null;
  if(pw.type&&!pw.a)pw.a=others[0];
  if(pw.type==='swap'&&(!pw.b||pw.b===pw.a))pw.b=others.find(x=>x!==pw.a);
  const sel=(k,v,ex)=>`<select class="in" data-pw="${k}">${others.filter(x=>x!==ex).map(id=>`<option value="${id}"${id===v?' selected':''}>${nm(id)}</option>`).join('')}</select>`;
  show(`<section class="scr">
   <p class="lbl">Kronen-Macht</p><h2>${CROWN(28)} ${nm(cid)}, wähl deine Macht</h2>
   ${Object.entries(POWERS).filter(([k,v])=>others.length>=v.need).map(([k,v])=>`<button class="card${pw.type===k?' on':''}" data-act="pw" data-k="${k}"><b>${v.label}</b><span>${v.desc}</span></button>`).join('')}
   ${pw.type==='force'?`<p class="lbl">Wer muss All-In?</p>${sel('a',pw.a)}`:''}
   ${pw.type==='swap'?`<p class="lbl">Wer tauscht?</p><div class="two">${sel('a',pw.a)}${sel('b',pw.b,pw.a)}</div>`:''}
   ${pw.type==='curse'?`<p class="lbl">Wen erwischt es?</p><div class="two">${sel('a',pw.a)}<select class="in" data-pw="eff">${Object.entries(EFFECTS).map(([k,e])=>`<option value="${k}"${k===pw.eff?' selected':''}>${e.label}</option>`).join('')}</select></div>`:''}
   <button class="btn" id="use" ${pw.type?'':'disabled'}>Macht einsetzen</button>
   <button class="btn sec" id="skip">Verzichten</button></section>`,keep);
  $('#use').onclick=()=>{
    if(pw.type==='force'){R.locked[pw.a]=1;R.strat[pw.a]='allin'}
    if(pw.type==='swap'){const A=P(pw.a),B=P(pw.b);[A.score,B.score]=[B.score,A.score];updateCrown();board()}
    if(pw.type==='curse')R.sabs.push({from:cid,to:pw.a,eff:pw.eff});
    SFX.bad();flash();buzz(120);stratScreen();
  };
  $('#skip').onclick=()=>stratScreen();
}
function stratScreen(keep){
  const isSab=id=>R.strat[id]==='sab';
  const parts=S.players.filter(p=>!isSab(p.id)).map(p=>p.id);
  let err='';
  S.players.forEach(p=>{if(!isSab(p.id))return;const valid=parts.filter(x=>x!==p.id);
    if(!valid.includes(R.sabT[p.id]))R.sabT[p.id]=valid[0];if(!R.sabE[p.id])R.sabE[p.id]='dbl';});
  if(parts.length<2)err='Mindestens 2 müssen mitspielen.';
  const small=S.players.length<3;
  show(`<section class="scr">
   <p class="lbl">Einsatz & Risiko</p><h2>Wer riskiert wie viel?</h2>
   <p class="sub">Handy rumgeben oder einfach laut sagen.${R.hot?' <b style="color:var(--red)">Heißes Eisen: Sieg kostet doppelt.</b>':''}</p>
   ${S.players.map(p=>{const id=p.id,cur=R.strat[id],lk=R.locked[id];return `<div class="row"><div class="rh">${S.crown&&S.crown.id===id?CROWN(18):''}${esc(p.name)}${lk?'<span class="tag g">Zu All-In gezwungen</span>':''}</div>
     <div class="seg">${Object.entries(STRATS).map(([k,s])=>`<button data-act="strat" data-id="${id}" data-k="${k}" class="${k}${cur===k?' on':''}" ${lk||(k==='sab'&&small)?'disabled':''}>${s.label}</button>`).join('')}</div>
     <p class="hint">${small&&cur!=='sab'?STRATS[cur].hint+' · Saboteur ab 3 Spielern':STRATS[cur].hint}</p>
     ${cur==='sab'&&parts.length?`<div class="two"><select class="in" data-sab="t" data-id="${id}" aria-label="Ziel">${parts.filter(x=>x!==id).map(x=>`<option value="${x}"${x===R.sabT[id]?' selected':''}>${nm(x)}</option>`).join('')}</select><select class="in" data-sab="e" data-id="${id}" aria-label="Nachteil">${Object.entries(EFFECTS).map(([k,e])=>`<option value="${k}"${k===R.sabE[id]?' selected':''}>${e.label}</option>`).join('')}</select></div>`:''}</div>`}).join('')}
   <p class="err">${err}</p>
   <button class="btn" id="lock" ${err?'disabled':''}>Einsätze fix</button></section>`,keep);
  $('#lock').onclick=()=>{
    if(R.parts.length)return;R.parts=parts;
    S.players.forEach(p=>{if(isSab(p.id))R.sabs.push({from:p.id,to:R.sabT[p.id],eff:R.sabE[p.id]})});
    R.sabs.length?sabReveal():startGame();
  };
}
function sabReveal(){
  SFX.bad();buzz([80,40,80]);flash();
  show(`<section class="scr"><p class="lbl">Sabotage!</p><h2>Das habt ihr euch verdient</h2>
   ${R.sabs.map((s,i)=>`<div class="sabcard" style="animation-delay:${i*.18}s"><div>${nm(s.from)} erwischt ${nm(s.to)}<small>${EFFECTS[s.eff].label}${s.eff==='slow'?' – '+GAMES[R.game].slow:s.eff==='dbl'?' – trinkt bei Sieg doppelt':s.eff==='minus'?' – bekommt bei Sieg 1 Punkt weniger':' – spielt mit der schwachen Hand'}</small></div></div>`).join('')}
   <button class="btn" id="go">Minispiel starten</button></section>`);
  $('#go').onclick=startGame;
}
function startGame(){GAMES[R.game].play(R.parts,result)}

// ================= AUSWERTUNG =================
function result(winners){
  show(`<section class="center"><div class="drum">Und gewonnen hat …</div></section>`);
  later(()=>reveal(winners),1100);
}
function reveal(winners){
  const cs=R.crownStart;
  const res=winners.map(id=>{
    const s=STRATS[R.strat[id]],dbl=cnt(id,'dbl'),minus=cnt(id,'minus');
    const pts=Math.max(0,s.pts-minus);let d=s.drinks;const chips=[`${s.label}: ${s.drinks}`];
    if(minus)chips.push(`Punktklau −${minus}`);
    if(dbl){d*=2**dbl;chips.push(`Sabotage ×${2**dbl}`)}
    if(R.hot){d*=2;chips.push('Heißes Eisen ×2')}
    if(id===cs&&S.crown&&S.crown.id===id){S.crown.streak++;const m=Math.min(3,1+S.crown.streak);d*=m;chips.push(`Fluch der Krone ×${m}`)}
    const capped=d>MAX_DRINKS;d=Math.min(d,MAX_DRINKS);
    P(id).score+=pts;return{id,pts,d,capped,chips};
  });
  const newCrown=updateCrown();board();
  const champ=S.players.some(p=>p.score>=S.target);
  if(res.length){SFX.win();buzz([60,40,160])}else SFX.tap();
  show(`<section class="scr center">
   ${res.length?res.map(r=>`<div class="coaster${R.hot?' hot':''}${res.length>1?' sm':''} pop"><div class="who">${nm(r.id)}</div><div class="pts">+${r.pts} ${r.pts===1?'Punkt':'Punkte'}</div><div class="big">${r.d}</div><div class="unit">${r.d===1?'SCHLUCK':'SCHLUCKE'}${r.capped?' · MAX':''}</div></div><div class="tags">${r.chips.map(c=>`<span class="tag c">${c}</span>`).join('')}</div>`).join(''):`<div class="coaster pop"><div class="who">Keiner gewinnt</div><div class="pts">Alle verschont. Diesmal.</div></div>`}
   ${newCrown?`<div class="banner">${CROWN(20)}<div><b>Neue Krone: ${nm(newCrown)}</b><br><small>Ab jetzt kostet jeder weitere Sieg extra.</small></div></div>`:''}
   ${newCrown===null?'<div class="banner">'+CROWN(20)+'<div><b>Gleichstand an der Spitze</b><br><small>Die Krone ist frei.</small></div></div>':''}
   <button class="btn" id="next">${champ?'Zur Siegerehrung':'Nächste Runde'}</button></section>`);
  $('#next').onclick=()=>champ?victory():nextRound();
}
function victory(){
  const max=Math.max(...S.players.map(p=>p.score)),champs=S.players.filter(p=>p.score===max);
  SFX.fanfare();buzz([100,60,100,60,300]);
  const cols=['#ffc93c','#f6e7c8','#ff4757','#ffffff'];
  show(`<section class="scr center">
   <div class="confetti">${Array.from({length:70},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%4]};animation-duration:${rnd(2.2,4.2).toFixed(2)}s;animation-delay:${rnd(0,1.2).toFixed(2)}s"></i>`).join('')}</div>
   <p class="lbl">Gesamtsieg</p>
   <div class="coaster gold pop">${CROWN(54)}<div class="who">${champs.map(p=>esc(p.name)).join(' & ')}</div><div class="pts">${max} Punkte</div></div>
   <h2>Sieger-Drink!</h2><p class="sub">Ein Shot oder ein richtig großer Schluck. Dafür bestimmst du die Königs-Regel für die nächste Partie.</p>
   <label class="lbl" for="kr" style="display:block;text-align:left">Königs-Regel</label>
   <textarea id="kr" class="in" maxlength="90" placeholder="z. B. Wer flucht, trinkt einen Schluck.">${esc(S.kingRule)}</textarea>
   <button class="btn sec" id="idea">Zufalls-Idee</button>
   <button class="btn" id="again">Revanche</button>
   <button class="btn sec" id="menu">Spieler ändern</button></section>`);
  const keep=()=>{S.kingRule=$('#kr').value.trim();save()};
  $('#idea').onclick=()=>{$('#kr').value=pick(KING_IDEAS.filter(k=>k!==$('#kr').value))};
  $('#again').onclick=()=>{keep();newGame()};
  $('#menu').onclick=()=>{keep();goSetup()};
}

// ================= MINISPIELE =================
// Jedes Spiel: name, desc, slow (was "Bremse" hier bedeutet), optional hot, play(teilnehmerIds, done(gewinnerIds))
const GAMES={
  timing:{name:'Zeitgefühl',desc:'Stopp die Uhr blind auf die Zielzeit. Am nächsten dran gewinnt.',slow:'+0,5 s Strafe',
    play(parts,done){
      const T=pick([5,7,10]),order=shuffle(parts),res={};let i=0;
      const turn=()=>{
        if(i>=order.length)return finish();const id=order[i];
        show(`<section class="scr center"><p class="lbl">Zeitgefühl · ${i+1} von ${order.length}</p><h2>Handy an ${nm(id)}</h2>
         <p class="sub">Stopp bei genau <b style="color:var(--gold)">${T},00 Sekunden</b>.<br>Nach 1 Sekunde wird die Uhr unsichtbar.</p>${tags(id)}
         <div class="clock" id="clk">0,00</div><button class="btn huge" id="tb">START</button></section>`);
        const b=$('#tb'),clk=$('#clk');let t0=0,run=false,doneTurn=false;
        b.addEventListener('pointerdown',e=>{e.preventDefault();if(doneTurn)return;
          if(!run){run=true;t0=performance.now();b.textContent='STOP';b.classList.add('red');SFX.tap();
            const loop=()=>{const el=(performance.now()-t0)/1000;clk.textContent=el<1?sec(el):'?,??';raf=requestAnimationFrame(loop)};loop();}
          else{doneTurn=true;cancelAnimationFrame(raf);const el=(performance.now()-t0)/1000;
            res[id]={el,diff:Math.abs(el-T)+(has(id,'slow')?.5:0)};SFX.go();buzz(50);
            clk.textContent='Gestoppt';b.classList.remove('red');b.textContent=i+1<order.length?'Weitergeben':'Auflösen';
            later(()=>{b.onclick=()=>{i++;turn()}},250);}
        });
      };
      const finish=()=>{
        const rank=order.map(id=>({id,...res[id]})).sort((a,b)=>a.diff-b.diff);const best=rank[0].diff;
        const win=rank.filter(r=>r.diff-best<.005).map(r=>r.id);
        show(`<section class="scr"><p class="lbl">Zeitgefühl · Ziel ${T},00 s</p><h2>Wer hat's im Blut?</h2>
         <table><tr><th>Spieler</th><th class="r">Gestoppt</th><th class="r">Daneben</th></tr>${rank.map(r=>`<tr class="${win.includes(r.id)?'win':''}"><td>${nm(r.id)}</td><td class="r">${sec(r.el)} s</td><td class="r">${sec(r.diff)} s${has(r.id,'slow')?' *':''}</td></tr>`).join('')}</table>
         ${rank.some(r=>has(r.id,'slow'))?'<p class="hint">* inklusive 0,5 s Bremse</p>':''}
         <button class="btn" id="ok">Auswertung</button></section>`);
        $('#ok').onclick=()=>done(win);
      };
      turn();
    }},
  reaction:{name:'Reaktions-Duell',desc:'Alle Finger aufs Handy. Wer bei GRÜN zuerst tippt, gewinnt. Zu früh = raus.',slow:'+0,25 s Strafe',
    play(parts,done){
      show(`<section class="scr"><p class="lbl">Reaktions-Duell</p><div class="signal" id="sig">Finger bereit</div>
       <div class="rgrid">${parts.map(id=>`<button class="rbtn" id="r_${id}">${nm(id)}${has(id,'slow')?'<small>Bremse +0,25 s</small>':''}${has(id,'hand')?'<small>Schwache Hand!</small>':''}</button>`).join('')}</div>
       <button class="btn" id="go">Start</button></section>`);
      let st='idle',green=0;const t={},out={};const sig=$('#sig');
      const fin=()=>{if(st==='end')return;st='end';
        const ok=parts.filter(id=>t[id]!=null).sort((a,b)=>t[a]-t[b]);
        later(()=>{
          if(!ok.length){show(`<section class="scr center"><h2>Alle zu früh oder zu lahm</h2><p class="sub">Keiner kriegt Punkte. Keiner trinkt.</p><button class="btn" id="ok">Weiter</button></section>`);$('#ok').onclick=()=>done([]);return}
          const win=ok.filter(id=>t[id]-t[ok[0]]<1);
          show(`<section class="scr"><p class="lbl">Reaktions-Duell</p><h2>Schnellster Finger</h2><table><tr><th>Spieler</th><th class="r">Zeit</th></tr>${parts.map(id=>({id,v:t[id]})).sort((a,b)=>(a.v??1e9)-(b.v??1e9)).map(r=>`<tr class="${win.includes(r.id)?'win':''}"><td>${nm(r.id)}</td><td class="r">${r.v!=null?Math.round(r.v)+' ms'+(has(r.id,'slow')?' *':''):(out[r.id]?'Frühstart':'–')}</td></tr>`).join('')}</table>${parts.some(id=>has(id,'slow'))?'<p class="hint">* inklusive 250 ms Bremse</p>':''}<button class="btn" id="ok">Auswertung</button></section>`);
          $('#ok').onclick=()=>done(win);
        },700);
      };
      parts.forEach(id=>{const b=$('#r_'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();
        if(st==='wait'&&!out[id]){out[id]=1;b.classList.add('out');b.innerHTML=nm(id)+'<small>Frühstart – raus!</small>';SFX.bad();buzz(90);if(parts.every(x=>out[x]))fin()}
        else if(st==='go'&&!out[id]&&t[id]==null){t[id]=performance.now()-green+(has(id,'slow')?250:0);b.classList.add('done');b.innerHTML=nm(id)+`<small>${Math.round(t[id])} ms</small>`;SFX.tap();if(parts.every(x=>out[x]||t[x]!=null))fin()}
      })});
      $('#go').onclick=()=>{$('#go').style.visibility='hidden';st='wait';sig.className='signal wait';sig.textContent='Warten …';
        later(()=>{if(st!=='wait')return;st='go';green=performance.now();sig.className='signal go';sig.textContent='JETZT!';SFX.go();buzz(40);later(fin,2500)},rnd(1800,5200));};
    }},
  estimate:{name:'Schätz-Runde',desc:'Eine Frage, alle schätzen laut. Wer am nächsten dran ist, gewinnt.',slow:'muss als Erster schätzen',
    play(parts,done){
      let pool=QUESTIONS.map((_,i)=>i).filter(i=>!S.usedQ.includes(i));if(!pool.length){S.usedQ=[];pool=QUESTIONS.map((_,i)=>i)}
      const qi=pick(pool);S.usedQ.push(qi);const[q,a,u]=QUESTIONS[qi];
      const slow=parts.filter(id=>has(id,'slow')),order=[...shuffle(slow),...shuffle(parts.filter(id=>!slow.includes(id)))];
      show(`<section class="scr center"><p class="lbl">Schätz-Runde</p><div class="q">${esc(q)}</div>
       <div class="cd" id="cd">10</div><p class="sub" id="cdt">Kurz nachdenken …</p>
       <p class="lbl">Reihum laut sagen</p><div class="order">${order.map((id,i)=>`<span class="tag ${has(id,'slow')?'':'c'}">${i+1}. ${nm(id)}</span>`).join('')}</div>
       <button class="btn" id="rev">Auflösen</button></section>`);
      let n=10;const cd=$('#cd');
      const tick=()=>{n--;if(n<=0){cd.textContent='Los!';$('#cdt').textContent='Jetzt laut schätzen – keiner darf mehr ändern.';SFX.go();return}cd.textContent=n;if(n<=3)SFX.tick();later(tick,1000)};later(tick,1000);
      $('#rev').onclick=()=>{
        const sel=new Set();SFX.win();
        const draw=()=>{show(`<section class="scr center"><p class="lbl">Richtige Antwort</p><div class="q" style="font-size:22px;color:var(--mute)">${esc(q)}</div>
          <div class="coaster pop"><div class="big" style="font-size:clamp(48px,15vw,76px)">${fmt(a)}</div><div class="unit">${esc(u)||'&nbsp;'}</div></div>
          <p class="lbl">Wer war am nächsten dran? (bei Gleichstand mehrere)</p>
          <div class="pick">${parts.map(id=>`<button data-id="${id}" class="${sel.has(id)?'on':''}">${nm(id)}</button>`).join('')}</div>
          <button class="btn" id="ok" ${sel.size?'':'disabled'}>Bestätigen</button></section>`,true);
          app.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);SFX.tap();draw()});
          $('#ok').onclick=()=>done([...sel]);};
        draw();
      };
    }},
  bomb:{name:'Heißes Eisen',hot:true,desc:'Tippen, weitergeben, bevor’s knallt. Wer’s beim Knall hält, gewinnt.',slow:'muss 2× tippen zum Weitergeben',
    play(parts,done){
      const order=shuffle(parts);
      show(`<section class="scr center"><p class="lbl">Heißes Eisen · Schlucke ×2</p><h2>Im Kreis weitergeben</h2>
       <div class="order">${order.map((id,i)=>`<span class="tag ${has(id,'slow')?'':'c'}">${i+1}. ${nm(id)}${has(id,'slow')?' · 2× tippen':''}</span>`).join('')}</div>
       <p class="sub">Der Knopf springt rum. Niemand weiß, wann's knallt.</p><button class="btn red" id="st">Eisen anheizen</button></section>`);
      $('#st').onclick=()=>{
        let idx=0,need=0,lockT=0,over=false;const fuse=rnd(10000,22000),t0=performance.now();
        show(`<section class="scr center"><p class="lbl">Heißes Eisen · Schlucke ×2</p><h2 id="hd"></h2><p class="sub" id="hh"></p><div class="arena" id="ar"><button class="pass" id="ps">Weiter&shy;geben</button></div></section>`);
        const ps=$('#ps'),ar=$('#ar');
        const set=()=>{const id=order[idx];need=has(id,'slow')?2:1;$('#hd').textContent=P(id).name+' hat das Eisen!';$('#hh').textContent=need>1?'Bremse: 2× tippen':'Tippen und schnell weiter';ps.innerHTML='Weiter&shy;geben';ps.style.left=rnd(26,74)+'%';ps.style.top=rnd(24,76)+'%'};
        set();
        ps.addEventListener('pointerdown',e=>{e.preventDefault();const now=performance.now();if(over||now<lockT)return;need--;SFX.tap();
          if(need>0){ps.textContent='Nochmal!';return}idx=(idx+1)%order.length;lockT=now+350;buzz(25);set()});
        const boom=()=>{over=true;const id=order[idx];SFX.boom();buzz([250,80,400]);ar.classList.add('boom');ps.style.display='none';
          $('#hd').textContent='BUMM!';$('#hh').innerHTML=`<b style="color:var(--ink)">${nm(id)}</b> hält das Eisen.`;
          later(()=>{const b=document.createElement('button');b.className='btn';b.id='ok';b.textContent='Auswertung';b.onclick=()=>done([id]);ar.after(b)},600)};
        const tick=()=>{const el=performance.now()-t0;if(el>=fuse)return boom();SFX.tick();later(tick,Math.max(110,Math.min(650,(fuse-el)/7)))};tick();
      };
    }}
};

// ================= EVENTS =================
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;audio();
  if(a==='rm'){S.players=S.players.filter(p=>p.id!==b.dataset.id);save();goSetup()}
  else if(a==='target'){S.target=+b.dataset.n;save();goSetup()}
  else if(a==='start'){save();newGame()}
  else if(a==='strat'){R.strat[b.dataset.id]=b.dataset.k;SFX.tap();stratScreen(true)}
  else if(a==='pw'){R.pw.type=b.dataset.k;SFX.tap();powerScreen(true)}
  else if(a==='sound'){S.sound=!S.sound;save();board();if(S.sound)SFX.tap()}
  else if(a==='quit'){if(b.dataset.armed){goSetup()}else{b.dataset.armed='1';b.textContent='Wirklich?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Menü'}},2500)}}
});
document.addEventListener('change',e=>{
  const s=e.target;
  if(s.dataset.sab){(s.dataset.sab==='t'?R.sabT:R.sabE)[s.dataset.id]=s.value;stratScreen(true)}
  if(s.dataset.pw){R.pw[s.dataset.pw]=s.value;powerScreen(true)}
});

load();goSetup();
}
</script>
<script>
if('serviceWorker' in navigator&&window.isSecureContext){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
